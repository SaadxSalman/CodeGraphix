<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectorphile</title>
    <link rel="icon" href="BG Free Logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        html, body {
            height: 100%;
            margin: 0;
            font-family: sans-serif;
            background-color: #111827;
            overflow: hidden;
        }

        /* Page Load Animation */
        .fade-in {
            opacity: 0;
            transform: scale(0.98);
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Futuristic GitHub Hover Effect */
        .github-icon {
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 5px #22c55e); /* Initial glow */
        }

        .github-icon:hover {
            transform: scale(1.2) rotate(5deg); /* Slight rotation and scale */
            filter: drop-shadow(0 0 15px #22c55e) brightness(1.3); /* Intense neon glow */
            animation: neonPulse 1s infinite alternate; /* Neon pulsing animation */
        }

        @keyframes neonPulse {
            0% { filter: drop-shadow(0 0 5px #22c55e); }
            50% { filter: drop-shadow(0 0 20px #22c55e); }
            100% { filter: drop-shadow(0 0 5px #22c55e); }
        }

        /* Tear Dropping Effect */
        .raindrop {
            position: absolute;
            top: 0;
            left: 50%;
            width: 5px;
            height: 15px;
            background-color: rgba(0, 183, 255, 0.7);
            border-radius: 50%;
            animation: rainDrop 2s linear infinite;
        }

        @keyframes rainDrop {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen fade-in">

    <!-- Rain Effect Container -->
    <div id="rain-container"></div>

    <!-- Header -->
    <header class="bg-gray-800 text-white px-4 flex items-center border-b border-gray-700">
        <img src="BG Free Logo.png" alt="Vectorphile Logo" class="h-20 w-20"> 
        <div>
            <h1 class="text-2xl font-bold">Vectorphile</h1>
            <p class="text-green-300 text-sm italic">𝐓𝐨𝐠𝐞𝐭𝐡𝐞𝐫 𝐖𝐞 𝐂𝐨𝐝𝐞, 𝐓𝐨𝐠𝐞𝐭𝐡𝐞𝐫 𝐖𝐞 𝐎𝐩𝐞𝐧 𝐒𝐨𝐮𝐫𝐜𝐞</p>
        </div>
        <div class="flex items-center space-x-4 ml-auto">
            <a href="https://github.com/vectorphile" target="_blank" class="flex items-center space-x-2 text-white hover:text-green-300">
                <img src="https://img.icons8.com/?size=100&id=LoL4bFzqmAa0&format=png&color=000000" 
                     alt="GitHub Logo" 
                     class="w-10 h-10 github-icon">
            </a>
        </div>
    </header>

    <script>
        function createRain() {
            const rainContainer = document.getElementById("rain-container");
            for (let i = 0; i < 50; i++) {
                let drop = document.createElement("div");
                drop.classList.add("raindrop");
                drop.style.left = Math.random() * 100 + "vw";
                drop.style.animationDuration = (Math.random() * 2 + 1) + "s";
                rainContainer.appendChild(drop);
                setTimeout(() => {
                    drop.remove();
                }, 3000);
            }
        }
        setInterval(createRain, 500);
    </script>

</body>
</html>

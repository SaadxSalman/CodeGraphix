<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectorphile</title>
    <link rel="icon" href="BG Free Logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        html, body {
            height: 100%;
            margin: 0;
            font-family: sans-serif;
            background-color: #111827;
        }

        /* Page Load Animation */
        .fade-in {
            opacity: 0;
            transform: scale(0.98);
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Tear Drop Animation */
        .tear {
            position: absolute;
            top: -50px;
            left: 50%;
            width: 20px;
            height: 30px;
            background: linear-gradient(to bottom, #3b82f6, #1e40af);
            border-radius: 50% 50% 50% 50%;
            transform: rotate(45deg);
            opacity: 0.8;
            animation: drop 2s infinite ease-in-out;
        }

        @keyframes drop {
            0% {
                transform: translateY(0) scale(1) rotate(45deg);
                opacity: 1;
            }
            50% {
                transform: translateY(150px) scale(1.1) rotate(45deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(250px) scale(0.8) rotate(45deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen fade-in">

    <!-- Animated Tear Drop -->
    <div class="tear"></div>

    <!-- Header -->
    <header class="bg-gray-800 text-white px-4 flex items-center border-b border-gray-700">
        <img src="BG Free Logo.png" alt="Vectorphile Logo" class="h-20 w-20"> 
        <div>
            <h1 class="text-2xl font-bold">Vectorphile</h1>
            <p class="text-green-300 text-sm italic">𝐓𝐨𝐠𝐞𝐭𝐡𝐞𝐫 𝐖𝐞 𝐂𝐨𝐝𝐞, 𝐓𝐨𝐠𝐞𝐭𝐡𝐞𝐫 𝐖𝐞 𝐎𝐩𝐞𝐧 𝐒𝐨𝐮𝐫𝐜𝐞</p>
        </div>
    </header>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-300 text-center py-2 border-t border-gray-700">
        <p>© <span id="year"></span> Vectorphile. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>
</html>
